services:
  - type: web
    name: fs-games-app
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: JWT_SECRET
        value: fs-games-2026-secret-key-fkw1160-replace-in-prod
      - key: DB_PATH
        value: /data/fsgames.db
    disk:
      name: fsgames-data
      mountPath: /data
      sizeGB: 1
