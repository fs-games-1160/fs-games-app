services:
  - type: web
    name: fs-games-app
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: JWT_SECRET
        value: fs-games-2026-secret-key-fkw1160-replace-in-prod
      - key: GIT_DATA_REPO
        value: fs-games-1160/fs-games-data
      - key: GIT_DATA_TOKEN
        sync: false
      - key: ADMIN_PIN
        value: "4499"
